<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .game-wrapper {
      position: relative;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    #gameBoard {
      display: grid;
      grid-template-columns: repeat(20, 20px);
      grid-template-rows: repeat(20, 20px);
      gap: 1px;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
    }

    .cell {
      background: white;
      border-radius: 2px;
      transition: background 0.05s ease;
    }

    .cell.snake {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 3px;
    }

    .cell.snake.head {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.3);
      border-radius: 50%;
    }

    .cell.food {
      background: #ff6b6b;
      border-radius: 50%;
      animation: pulse 0.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .stats {
      display: flex;
      gap: 32px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      color: #999;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-value {
      color: #667eea;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      border: 2px solid #e0e0e0;
    }

    .btn-secondary:hover {
      background: #e8e8e8;
      border-color: #d0d0d0;
    }

    .status {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      margin-top: 12px;
      min-height: 20px;
    }

    .status.game-over {
      color: #ff6b6b;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }

      .game-wrapper {
        padding: 16px;
      }

      #gameBoard {
        grid-template-columns: repeat(16, 18px);
        grid-template-rows: repeat(16, 18px);
      }

      .stats {
        gap: 20px;
      }

      button {
        padding: 10px 16px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐍 Snake</h1>

    <div class="game-wrapper">
      <div id="gameBoard"></div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Length</div>
          <div class="stat-value" id="length">1</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="startBtn">Start Game</button>
        <button class="btn-secondary" id="resetBtn">Reset</button>
      </div>

      <div class="status" id="status">Use arrow keys to move</div>
    </div>
  </div>

  <script>
    const GRID_SIZE = 20;
    const CELL_COUNT = GRID_SIZE * GRID_SIZE;

    let gameBoard = [];
    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};
    let score = 0;
    let gameRunning = false;
    let gameOver = false;
    let gameLoopId = null;

    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreDisplay = document.getElementById('score');
    const lengthDisplay = document.getElementById('length');
    const statusDisplay = document.getElementById('status');
    const gameBoardEl = document.getElementById('gameBoard');

    function initBoard() {
      gameBoard = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
    }

    function renderBoard() {
      gameBoardEl.innerHTML = '';

      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          const isSnakeBody = snake.some((segment, i) => segment.x === x && segment.y === y);
          if (isSnakeBody) {
            cell.classList.add('snake');
            if (snake[0].x === x && snake[0].y === y) {
              cell.classList.add('head');
            }
          }

          if (food.x === x && food.y === y) {
            cell.classList.add('food');
          }

          gameBoardEl.appendChild(cell);
        }
      }
    }

    function spawnFood() {
      let newFood;
      let valid = false;

      while (!valid) {
        newFood = {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE)
        };
        valid = !snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
      }

      food = newFood;
    }

    function update() {
      direction = nextDirection;

      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };

      // Check wall collision
      if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
        endGame();
        return;
      }

      // Check self collision
      if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      // Check food collision
      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        scoreDisplay.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }

      lengthDisplay.textContent = snake.length;
      renderBoard();
    }

    function gameLoop() {
      if (gameRunning && !gameOver) {
        update();
      }
    }

    function startGame() {
      if (!gameRunning) {
        gameRunning = true;
        gameOver = false;
        statusDisplay.textContent = 'Game running...';
        statusDisplay.classList.remove('game-over');
        startBtn.textContent = 'Pause';

        if (!gameLoopId) {
          gameLoopId = setInterval(gameLoop, 100);
        }
      } else {
        gameRunning = false;
        statusDisplay.textContent = 'Paused - Press Start to continue';
        startBtn.textContent = 'Resume';
      }
    }

    function endGame() {
      gameRunning = false;
      gameOver = true;
      statusDisplay.textContent = `Game Over! Final Score: ${score}`;
      statusDisplay.classList.add('game-over');
      startBtn.textContent = 'Start Game';
    }

    function resetGame() {
      gameRunning = false;
      gameOver = false;
      snake = [{x: 10, y: 10}];
      direction = {x: 1, y: 0};
      nextDirection = {x: 1, y: 0};
      score = 0;
      scoreDisplay.textContent = '0';
      lengthDisplay.textContent = '1';
      statusDisplay.textContent = 'Use arrow keys to move';
      statusDisplay.classList.remove('game-over');
      startBtn.textContent = 'Start Game';

      if (gameLoopId) {
        clearInterval(gameLoopId);
        gameLoopId = null;
      }

      spawnFood();
      renderBoard();
    }

    function handleKeyPress(e) {
      if (!gameRunning && !gameOver) return;

      const key = e.key.toLowerCase();

      // Prevent default arrow key scrolling
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
        e.preventDefault();
      }

      switch(key) {
        case 'arrowup':
          if (direction.y === 0) nextDirection = {x: 0, y: -1};
          break;
        case 'arrowdown':
          if (direction.y === 0) nextDirection = {x: 0, y: 1};
          break;
        case 'arrowleft':
          if (direction.x === 0) nextDirection = {x: -1, y: 0};
          break;
        case 'arrowright':
          if (direction.x === 0) nextDirection = {x: 1, y: 0};
          break;
      }
    }

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);
    document.addEventListener('keydown', handleKeyPress);

    // Initialize
    initBoard();
    spawnFood();
    renderBoard();
  </script>
</body>
</html>
